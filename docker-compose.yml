version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: robotaxi
      POSTGRES_PASSWORD: robotaxi
      POSTGRES_DB: robotaxi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robotaxi"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://robotaxi:robotaxi@postgres:5432/robotaxi?sslmode=disable
      REDIS_URL: redis:6379
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
